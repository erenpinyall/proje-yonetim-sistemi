services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - "ASPNETCORE_ENVIRONMENT=Development"
      - "ASPNETCORE_URLS=http://+:8080"
      - "ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-TaskTrackerDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      - "Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env (32+ characters)}"
      - "Jwt__Issuer=${JWT_ISSUER:-TaskTracker.API}"
      - "Jwt__Audience=${JWT_AUDIENCE:-TaskTracker.Client}"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      - "POSTGRES_USER=${POSTGRES_USER:-postgres}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      - "POSTGRES_DB=${POSTGRES_DB:-TaskTrackerDb}"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
